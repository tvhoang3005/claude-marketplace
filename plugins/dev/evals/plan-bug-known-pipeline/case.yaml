schema_version: "1.1"
name: plan-bug-known-pipeline
description: A bug with a stated cause is classified bug-fix-known, gets no Investigate phase, and state.md keeps the checklist format the resume hook reads.
tags: [pipeline, plan]
runs: 3
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    /dev:ai-dlc plan BUG-42

    There is no ticket tracker for this repo; here is the ticket text:
    "BUG-42: The date picker shows yesterday's date for users in UTC-5. Cause: formatDate() in
    src/lib/date.ts calls toISOString(), which converts local midnight to UTC. Fix should format
    in local time."
graders:
  - name: state-written
    type: file_exists
    path: ".ai-dlc/BUG-42/state.md"
  - name: intent-bug-fix-known
    type: regex
    target: { source: file, path: ".ai-dlc/BUG-42/state.md" }
    pattern: "bug-fix-known"
  - name: no-investigate-phase
    type: regex
    target: { source: file, path: ".ai-dlc/BUG-42/state.md" }
    pattern: "- \\[[ x]\\] investigate"
    match: not_contains
  - name: pipeline-checklist-format
    type: regex
    target: { source: file, path: ".ai-dlc/BUG-42/state.md" }
    pattern: "## Pipeline\\s*\\n- \\[x\\] plan[\\s\\S]*- \\[ \\] construct"
  - name: stops-at-checkpoint
    type: file_exists
    path: ".ai-dlc/BUG-42/specs.md"
    exists: false
