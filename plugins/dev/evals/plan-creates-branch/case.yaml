schema_version: "1.1"
name: plan-creates-branch
description: With the default isolation, Plan for a size-S bug moves the work onto its own fix/ branch before any code is written and records Branch and Isolation in state.md.
tags: [pipeline, plan, scaffold, isolation]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Write, Bash]
  prompt: |
    /dev:ai-dlc plan BUG-7

    No ticket tracker; ticket text:
    "BUG-7: tiny-cli --help prints 'Usage: tiny-cli [--help]' but should print 'Usage: tiny-cli [--help] [--version]'.
    Cause: the usage string in src/cli.js was not updated. One-line fix."
graders:
  - name: state-written
    type: file_exists
    path: ".ai-dlc/BUG-7/state.md"
  - name: switched-to-branch
    type: tool_used
    tool: Bash
    input_match: 'git (switch|checkout) -(c|b) fix/BUG-7'
    min: 1
  - name: branch-recorded
    type: regex
    target: { source: file, path: ".ai-dlc/BUG-7/state.md" }
    pattern: "Branch:\\s*\\**\\s*`?fix/BUG-7"
  - name: isolation-recorded
    type: regex
    target: { source: file, path: ".ai-dlc/BUG-7/state.md" }
    pattern: "Isolation:\\s*\\**\\s*`?branch"
  - name: no-worktree
    type: tool_used
    tool: Bash
    input_match: 'git worktree add'
    min: 0
    max: 0
