schema_version: "1.1"
name: plan-no-ticket-utf8
description: A request with no ticket — containing a ticket-like string such as UTF-8 — gets a slug work id and a written state.md, without asking for a ticket.
tags: [pipeline, plan]
runs: 3
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    /dev:ai-dlc plan fix the UTF-8 decoding bug: src/io/readFile.ts reads text files as latin1, so Vietnamese characters come out garbled. It should decode as UTF-8.
graders:
  - name: state-written
    type: file_exists
    path: ".ai-dlc/*/state.md"
  - name: utf8-not-used-as-work-id
    type: file_exists
    path: ".ai-dlc/UTF-8/**"
    exists: false
  - name: does-not-ask-for-ticket
    type: llm
    criteria: |
      PASS if the reply proceeds with planning from the request itself and does not ask the user to paste
      or provide a ticket, or claim it could not fetch ticket "UTF-8". Saying that UTF-8 is not a ticket id,
      or that there is no ticket, is correct behaviour and still PASSES.
      FAIL if it treats "UTF-8" as a ticket id, tries to fetch it, or asks the user for ticket text.
