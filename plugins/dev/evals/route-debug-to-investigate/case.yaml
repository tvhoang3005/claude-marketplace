schema_version: "1.1"
name: route-debug-to-investigate
description: A "why is this failing" question should start investigate, not ai-dlc or a direct fix.
tags: [routing, smoke]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Why is our checkout test failing intermittently on CI? It passes locally every time. Find the root cause.
graders:
  - name: investigate-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:dev:)?investigate"'
