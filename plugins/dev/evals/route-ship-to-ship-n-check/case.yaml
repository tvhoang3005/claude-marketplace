schema_version: "1.1"
name: route-ship-to-ship-n-check
description: "\"I'm done, ship it\" should start ship-n-check."
tags: [routing, smoke]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I'm done with my changes for TICKET-88. Ship it.
graders:
  - name: ship-n-check-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:dev:)?ship-n-check"'
