schema_version: "1.1"
name: route-split-to-breakdown
description: Asking to split a large ticket should start sdlc-breakdown.
tags: [routing]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    This ticket is way too big for one PR, break it down into smaller pieces:
    "EPIC-12: Add multi-tenant support — tenant table and migration, tenant-scoped auth tokens,
    row-level tenant filtering on every query, tenant admin UI, per-tenant billing export."
graders:
  - name: breakdown-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:dev:)?sdlc-breakdown"'
