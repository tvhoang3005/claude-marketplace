schema_version: "1.1"
name: no-trigger-on-general-question
description: A general programming question must not start any toolkit skill.
tags: [routing, negative]
runs: 3
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Quick question: what's the difference between a closure and a class in JavaScript?
graders:
  - name: no-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:engineering-toolkit:)?(?:ai-dlc|investigate|ship-n-check|sdlc-breakdown|security-review|handoff|codebase-review)"'
    min: 0
    max: 0
    arm: both
