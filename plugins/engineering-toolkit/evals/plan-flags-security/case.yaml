schema_version: "1.1"
name: plan-flags-security
description: A change to authentication must be flagged security-sensitive so Verify adds the security reviewer.
tags: [pipeline, plan]
runs: 3
execution:
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    /engineering-toolkit:ai-dlc plan FEAT-31

    No ticket tracker; ticket text:
    "FEAT-31: Let users sign in with a magic link sent by email. The link contains a one-time token,
    valid for 15 minutes, that creates a session when clicked."
graders:
  - name: state-written
    type: file_exists
    path: ".ai-dlc/FEAT-31/state.md"
  - name: security-flagged
    type: regex
    target: { source: file, path: ".ai-dlc/FEAT-31/state.md" }
    pattern: "Security-sensitive:\\s*\\**\\s*yes"
    flags: i
