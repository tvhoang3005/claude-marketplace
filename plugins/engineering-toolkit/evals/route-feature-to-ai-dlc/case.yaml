schema_version: "1.1"
name: route-feature-to-ai-dlc
description: A clear feature request should start the ai-dlc orchestrator.
tags: [routing, smoke]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Let's build a feature: add a GET /health endpoint to our API that returns {"status":"ok"} and the app version.
graders:
  - name: ai-dlc-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:engineering-toolkit:)?ai-dlc"'
