schema_version: "1.1"
name: route-wrapup-to-handoff
description: Stopping for the day and asking to save context should start handoff, not ship-n-check.
tags: [routing, smoke]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I'm stopping here for today. Save the context of what we've been doing so I can pick it up tomorrow in a fresh session.
graders:
  - name: handoff-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:engineering-toolkit:)?handoff"'
  - name: ship-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:engineering-toolkit:)?ship-n-check"'
    min: 0
    max: 0
    arm: both
