schema_version: "1.1"
name: no-trigger-on-generic-react
description: A generic React state question must not start pwa-stack.
tags: [routing, negative]
runs: 3
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    In React, when should I use useReducer instead of several useState calls?
graders:
  - name: no-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:pwa-toolkit:)?pwa-stack"'
    min: 0
    max: 0
    arm: both
