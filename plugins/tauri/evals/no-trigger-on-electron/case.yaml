schema_version: "1.1"
name: no-trigger-on-electron
description: An Electron question must not start the tauri-stack skill.
tags: [routing, negative]
runs: 3
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    In my Electron app, how do I expose a function from the main process to the renderer safely using contextBridge and a preload script?
graders:
  - name: no-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:tauri:)?tauri-stack"'
    min: 0
    max: 0
    arm: both
